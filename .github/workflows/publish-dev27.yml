name: Publish Mechanica dev.27 JAR

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-dev27.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build release JAR
        run: gradle --no-daemon build --stacktrace

      - name: Publish direct JAR download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar_file="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"
          test -n "$jar_file"
          cp "$jar_file" Mechanica-3.0.6-dev.27.jar
          if gh release view v3.0.6-dev.27 >/dev/null 2>&1; then
            gh release upload v3.0.6-dev.27 Mechanica-3.0.6-dev.27.jar --clobber
          else
            gh release create v3.0.6-dev.27 Mechanica-3.0.6-dev.27.jar --target "$GITHUB_SHA" --title "Mechanica 3.0.6-dev.27" --notes "Development build with the Ice Generator, functional schematic creator cards, Extractor fixes, Constructor and Phase Glass improvements." --prerelease
          fi

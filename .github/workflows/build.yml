name: Build Mechanica

on:
  push:
    branches: [dev/constructor-rework]
    paths-ignore:
      - 'builds/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: gradle --no-daemon clean build
      - uses: actions/upload-artifact@v4
        with:
          name: Mechanica
          path: build/libs/*.jar
      - name: Publish JAR in repository
        shell: bash
        run: |
          mkdir -p builds
          rm -f builds/Mechanica-*.jar
          cp build/libs/Mechanica-*.jar builds/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds
          if ! git diff --cached --quiet; then
            git commit -m "build: publish Mechanica JAR [skip ci]"
            git push origin HEAD:dev/constructor-rework
          fi

name: Build Mechanica

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build mod
        run: gradle --no-daemon build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Mechanica-main-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
